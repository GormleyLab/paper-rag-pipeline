# Paper RAG Pipeline Configuration
# AWS AgentCore Deployment

# Database (PostgreSQL + pgvector)
# Set DATABASE_URL environment variable for production
database_url: "postgresql+asyncpg://localhost:5432/paper_rag"

# AWS S3 for PDF storage
# Set via environment variables: S3_BUCKET, AWS_REGION
s3_bucket: "paper-rag-pdfs"
aws_region: "us-east-1"

# Vector configuration
vector_dimension: 3072

# Embeddings
embedding_model: "text-embedding-3-large"
openai_api_key: ""  # Set via OPENAI_API_KEY environment variable
batch_size: 100

# Chunking
chunking_strategy: "hybrid"
max_chunk_tokens: 1000
chunk_overlap: 150

# Metadata
crossref_api_url: "https://api.crossref.org/works"
crossref_email: ""  # Set via CROSSREF_EMAIL environment variable (optional but recommended)

# MCP Server
server_name: "paper-rag"
server_port: 8000
log_level: "INFO"

# Bibliography
default_bib_output: "./references.bib"
bibtex_entry_type: "article"  # Default if unknown
